# Merged automatically by `docker compose` with docker-compose.yaml in this folder.
# Added for the Daedalus infra health tracker (https://github.com/ArturSkrin/daedalus-infra-health).
#
# The EVE stack declares a named network, `proxy`, but only nginx is attached to it; app and db live on the
# project's private default network, where nothing outside the stack can reach them. The Daedalus collector
# joins `proxy`, so the app has to be there too.
#
# The database stays private on purpose. The collector learns its state from the app's /internal/vitals,
# so Postgres never has to be reachable from another stack.
services:
  app:
    networks:
      - default
      - proxy
    environment:
      # optional: require this token on /internal/vitals; set the same value for the collector
      VITALS_TOKEN: ${VITALS_TOKEN:-}
