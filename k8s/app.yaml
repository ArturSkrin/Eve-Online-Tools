apiVersion: apps/v1
kind: Deployment
metadata:
  name: eve-app
  namespace: eve
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eve-app
  template:
    metadata:
      labels:
        app: eve-app
    spec:
      containers:
        - name: eve-app
          image: ghcr.io/arturskrin/eve-online-tools:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: eve-secrets
                  key: DATABASE_URL
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-secrets
                  key: SESSION_SECRET
                  # optional so the app still starts before the secret has the key; login stays off until then
                  optional: true
            - name: EVE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: eve-secrets
                  key: EVE_CLIENT_ID
                  # optional so the app still starts before the secret has the key; login stays off until then
                  optional: true
            - name: EVE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: eve-secrets
                  key: EVE_CLIENT_SECRET
                  # optional so the app still starts before the secret has the key; login stays off until then
                  optional: true
            - name: EVE_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: eve-secrets
                  key: EVE_CALLBACK_URL
                  # optional so the app still starts before the secret has the key; login stays off until then
                  optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: eve-app
  namespace: eve
spec:
  selector:
    app: eve-app
  ports:
    - port: 80
      targetPort: 5000
